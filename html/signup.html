
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TravelGo</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-left">
            <a href="index.html" class="logo">TravelGo</a>

            <div class="auth-message">
                <h1>Your next adventure starts here.</h1>
                <p>Create your account and discover amazing destinations around the world.</p>
            </div>

            <div class="auth-decoration">
                <i class="fa-solid fa-earth-asia"></i>
            </div>
        </div>

        <div class="auth-right">
            <form id="signup-form" class="auth-form">

                <h2>Create Account</h2>
                <p class="form-subtitle">Join TravelGo and start exploring.</p>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter your city or country" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <a href="index.html" class="back-home">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>

            </form>
        </div>

    </div>

    <script src="../Js/auth.js"></script>
</body>
</html>
